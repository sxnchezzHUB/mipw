<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerPhones PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    /* --- NUEVOS ESTILOS PARA EL MENSAJE DE RED --- */
    #mensaje-conexion {
      padding: 10px;
      margin: 10px auto 25px;
      border-radius: 8px;
      font-weight: bold;
      max-width: 400px;
      transition: all 0.3s ease;
    }
    .online {
      background-color: rgba(0, 255, 0, 0.1);
      color: #00ffcc;
      border: 1px solid #00ffcc;
    }
    .offline {
      background-color: rgba(255, 0, 0, 0.1);
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
    }
    /* ------------------------------------------- */
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .tarjeta {
      background-color: #1e1e1e;
      border: 1px solid #00d2ff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
    }
    .tarjeta img {
      width: 100%;
      border-radius: 8px;
    }
    .tarjeta h3 {
      color: #00ffcc;
      margin: 15px 0 5px;
    }
    button {
      background: linear-gradient(45deg, #00d2ff, #00ffcc);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover {
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
    }
    #estado {
      margin-top: 15px;
      color: #aaaaaa;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Catálogo Celulares Gamer</h1>
  
  <!-- CONTENEDOR DEL MENSAJE DE CONEXIÓN -->
  <div id="mensaje-conexion" class="online">Verificando conexión...</div>
  
  <div class="catalogo">
    <!-- Teléfono 1 -->
    <div class="tarjeta">
      <img src="https://dummyimage.com/400x300/000/00d2ff.png&text=ASUS+ROG+Phone+8" alt="ROG Phone 8">
      <h3>ASUS ROG Phone 8</h3>
      <p>Snapdragon 8 Gen 3 | 165Hz AMOLED</p>
    </div>
    <!-- Teléfono 2 -->
    <div class="tarjeta">
      <img src="https://dummyimage.com/400x300/000/00ffcc.png&text=RedMagic+9+Pro" alt="RedMagic 9 Pro">
      <h3>RedMagic 11 Pro</h3>
      <p>Refrigeración activa con ventilador integrado</p>
    </div>
  </div>

  <button id="btn-sync">Sincronizar Favoritos</button>
  <button id="btn-notificar" style="margin-left: 10px; background: linear-gradient(45deg, #ff007f, #ff00cc);">Probar Notificación</button>
  <p id="estado"></p>

  <script src="app.js"></script>
</body>
</html>
